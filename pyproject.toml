[project]
name = "autonomous-trading-system-in"
version = "0.1.0"
description = "Autonomous 3-Agent Trading System for Indian Markets (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pytz>=2024.1",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
