# Deterministic Risk Engine Constraints (Zero LLM Bypass)
risk_limits:
  capital_allocation_pct: 90.0            # Use 90% of trading capital per trade
  max_single_stock_exposure_percent: 90.0 # Allow 90% allocation into single trade
  max_sector_exposure_percent: 90.0       # Allow 90% in sector
  stop_loss_pct: 5.0                      # Strictly 5.0% loss limit (auto square-off)
  profit_target_pct: 18.0                 # Target profit: 15% to 20% (default 18% - auto square-off)
  min_profit_target_pct: 15.0             # 15.0% minimum profit target
  max_profit_target_pct: 20.0             # 20.0% maximum profit target
  max_open_positions: 2                   # High-conviction concentrated positions
  daily_loss_limit_percent: 10.0          # Portfolio daily halt limit
  weekly_loss_limit_percent: 15.0         # Portfolio weekly review limit
  max_drawdown_limit_percent: 20.0        # Peak-to-trough portfolio drawdown limit
  min_expected_gain_to_cost_ratio: 3.0    # Expected gain must exceed 3x roundtrip statutory costs
  auto_squareoff_on_limits: true          # Automatically square off when limits are reached

trade_window:
  allowed_start_time: "09:30"
  allowed_end_time: "15:00"
  auto_squareoff_time: "15:15"

liquidity_hurdles:
  min_20d_adv_crores: 10.0                # Stock must trade at least ₹10 Cr daily average
  max_order_pct_of_adv: 2.5               # Max order percentage of ADV
  restricted_categories:
    - "ASM_STAGE_1"
    - "ASM_STAGE_2"
    - "ASM_STAGE_3"
    - "ASM_STAGE_4"
    - "GSM"
    - "FO_BAN"
